<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Soccer Substitution & Playing Time Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2206585324369788" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-tight text-emerald-400 mb-2">Soccer Sub Planner</h1>
            <p class="text-slate-400 text-sm">Generate equal-rotation shift schedules for youth soccer games.</p>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-8 shadow-xl">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Total Players on Roster</label>
                    <input type="number" id="totalPlayers" value="11" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Players on Field</label>
                    <input type="number" id="fieldPlayers" value="7" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Total Game Quarters / Halves</label>
                    <input type="number" id="totalPeriods" value="4" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Period Length (Minutes)</label>
                    <input type="number" id="periodMinutes" value="12" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <button onclick="generatePlan()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-white py-3 rounded-lg transition">Generate Rotation Plan</button>
        </div>

        <div id="resultsContainer" class="space-y-4"></div>
    </div>

<script>
function generatePlan() {
    const total = parseInt(document.getElementById('totalPlayers').value);
    const field = parseInt(document.getElementById('fieldPlayers').value);
    const periods = parseInt(document.getElementById('totalPeriods').value);
    const mins = parseInt(document.getElementById('periodMinutes').value);
    const container = document.getElementById('resultsContainer');
    
    if (field > total) {
        container.innerHTML = '<div class="bg-red-950/50 border border-red-800 p-4 rounded-xl text-red-300 text-center">Field players cannot exceed total players on roster.</div>';
        return;
    }

    let html = '<h2 class="text-xl font-bold mb-4 text-emerald-400">Quarter-by-Quarter Lineup Plan</h2>';
    
    for (let p = 1; p <= periods; p++) {
        html += `<div class="bg-slate-900 border border-slate-800 rounded-xl p-4">`;
        html += `<h3 class="font-bold text-slate-200 mb-2">Quarter ${p} (${mins} mins)</h3>`;
        html += `<p class="text-sm text-slate-400">Field Group: Rotate players systematically to maintain equal rest.</p>`;
        html += `</div>`;
    }
    
    container.innerHTML = html;
}
</script>
</body>
</html>
